name: Deploy to UiPath Serverless

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    environment: uipath-serverless
    concurrency:
      group: uipath-serverless-production
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Show deployment revision
        run: echo "Deploying revision $GITHUB_SHA to UiPath Serverless"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: 'latest'

      - name: Install dependencies
        run: uv sync --dev

      - name: Run tests before deployment
        run: uv run pytest -q

      - name: Authenticate to UiPath
        env:
          UIPATH_URL: ${{ secrets.UIPATH_URL }}
          UIPATH_CLIENT_ID: ${{ secrets.UIPATH_CLIENT_ID }}
          UIPATH_CLIENT_SECRET: ${{ secrets.UIPATH_CLIENT_SECRET }}
          UIPATH_SCOPES: ${{ secrets.UIPATH_SCOPES }}
        run: |
          test -n "$UIPATH_URL"
          test -n "$UIPATH_CLIENT_ID"
          test -n "$UIPATH_CLIENT_SECRET"
          test -n "$UIPATH_SCOPES"
          uv run uipath auth \
            --base-url "$UIPATH_URL" \
            --client-id "$UIPATH_CLIENT_ID" \
            --client-secret "$UIPATH_CLIENT_SECRET" \
            --tenant "DefaultTenant" \
            --scope "$UIPATH_SCOPES"

      - name: Generate function metadata
        run: uv run uipath init

      - name: Set immutable release version
        shell: bash
        run: |
          release_version="0.2.${{ github.run_number }}"
          sed -i -E "s/^version = \"[^\"]+\"/version = \"${release_version}\"/" pyproject.toml
          echo "Publishing calculator-agent ${release_version}"

      - name: Pack Python function
        run: uv run uipath pack --nolock

      - name: Verify packed project contract
        shell: bash
        run: |
          test -f uipath.json
          test -f entry-points.json
          test -f project.uiproj

      - name: Publish package to UiPath Processes feed
        run: |
          uv run uipath publish --tenant
