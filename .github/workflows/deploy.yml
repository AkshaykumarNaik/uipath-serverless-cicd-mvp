name: Deploy to UiPath Serverless

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: uipath-serverless
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: 'latest'

      - name: Install dependencies
        run: uv sync --dev

      - name: Run tests before deployment
        run: uv run pytest -q

      - name: Install UiPath CLI
        shell: bash
        run: |
          curl -fsSL https://download.uipath.com/uipath-cli/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Authenticate to UiPath
        env:
          UIPATH_URL: ${{ secrets.UIPATH_URL }}
          UIPATH_CLIENT_ID: ${{ secrets.UIPATH_CLIENT_ID }}
          UIPATH_CLIENT_SECRET: ${{ secrets.UIPATH_CLIENT_SECRET }}
          UIPATH_SCOPES: ${{ secrets.UIPATH_SCOPES }}
        run: |
          test -n "$UIPATH_URL"
          test -n "$UIPATH_CLIENT_ID"
          test -n "$UIPATH_CLIENT_SECRET"
          test -n "$UIPATH_SCOPES"
          uipath auth --help
          echo "Authentication command must be pinned to the installed CLI version before enabling deployment."
          exit 1
